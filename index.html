<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>데이터 AI 비서</title><style>
body{font-family:system-ui;max-width:900px;margin:30px auto;padding:0 16px;color:#172033}section{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}input,button{padding:9px;margin:4px;border:1px solid #bbb;border-radius:7px}button{cursor:pointer;background:#172033;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.chat{min-height:100px;background:#f5f7fa;padding:12px;border-radius:8px;white-space:pre-wrap}.muted{color:#667085}li{margin:7px 0}
</style></head><body><h1>데이터 기반 AI 비서</h1>
<section><h2>데이터 요약</h2><div id="summary" class="muted">불러오는 중...</div></section>
<section><h2>AI 채팅</h2><div id="chat" class="chat"></div><div class="row"><input id="question" placeholder="예: 평균이 어때요?" style="flex:1"><button onclick="ask()">질문</button></div></section>
<section><h2>데이터 관리</h2><div class="row"><input id="date" type="date"><input id="value" type="number" placeholder="값"><input id="memo" placeholder="메모"><button onclick="addData()">추가</button></div><ul id="data"></ul></section>
<section><h2>대화 기록</h2><ul id="conversations"></ul></section>
<script>const API=window.API_BASE_URL||localStorage.getItem('API_BASE_URL')||'http://localhost:8000';const $=id=>document.getElementById(id);async function api(path,opt){const r=await fetch(API+path,opt);if(!r.ok)throw Error(await r.text());return r.json()}async function refresh(){const s=await api('/api/data/summary');$('summary').textContent=`기간: ${s.period} · ${s.count}개 · 합계 ${s.metrics.total} · 평균 ${s.metrics.average} · 추세 ${s.trend}`;const d=await api('/api/data');$('data').innerHTML=d.map(x=>`<li>${x.date} — ${x.value} (${x.memo||''}) <button onclick="del('${x.id}')">삭제</button></li>`).join('')||'<li>데이터가 없습니다.</li>';const c=await api('/api/conversations');$('conversations').innerHTML=c.map(x=>`<li><button onclick="loadConv('${x.id}')">불러오기</button> ${x.title}</li>`).join('')||'<li>대화가 없습니다.</li>'}async function addData(){await api('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('date').value,value:Number($('value').value),memo:$('memo').value})});refresh()}async function del(id){await api('/api/data/'+id,{method:'DELETE'});refresh()}async function ask(){const q=$('question').value;if(!q)return;$('chat').textContent='답변을 준비 중입니다...';const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});$('chat').textContent='질문: '+q+'\n\n답변: '+r.answer;refresh()}async function loadConv(id){const c=await api('/api/conversations/'+id);$('chat').textContent=c.messages.map(m=>`${m.role}: ${m.content}`).join('\n\n')}refresh().catch(e=>$('summary').textContent='백엔드를 실행하세요: '+e.message)</script></body></html>
